version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-agrovet_be}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - backend

volumes:
  mysql_data:
  static_data:
  media_data:
